<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta http-equiv="refresh" content="3;url=sample.html">

<title>Welcome</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
        color: white;
    }

    .container {
        width: 90%;
        max-width: 520px;
        padding: 45px 35px;
        text-align: center;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .logo {
        width: 75px;
        height: 75px;
        margin: 0 auto 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        font-size: 32px;
    }

    h1 {
        font-size: 32px;
        margin-bottom: 12px;
    }

    p {
        color: rgba(255, 255, 255, 0.75);
        font-size: 16px;
        margin-bottom: 30px;
        line-height: 1.6;
    }

    .loader {
        width: 45px;
        height: 45px;
        margin: 0 auto 20px;
        border: 4px solid rgba(255, 255, 255, 0.25);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    .button {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 10px;
        background: white;
        color: #1e3a8a;
        text-decoration: none;
        font-weight: bold;
        transition: 0.25s ease;
    }

    .button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .footer {
        margin-top: 25px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }
</style>

</head>

<body>

<div class="container">

    <div class="logo">🚀</div>

    <h1>Welcome</h1>

    <p>
        Preparing your experience...
        <br>
        You will be redirected shortly.
    </p>

    <div class="loader"></div>

    <a href="sample.html" class="button">
        Continue
    </a>

    <div class="footer">
        Redirecting to the application
    </div>

</div>

</body> </html>
